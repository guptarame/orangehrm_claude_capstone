# TASK-003 (artifacts/impl-plan.md): environment configuration for the
# FR-001 / AC-001 suite. AD-004 (ConfigReader singleton, -D > env > file
# precedence, HTTPS fail-closed guard). Resolved by
# com.orangehrm.config.ConfigReader (TASK-004); every key here can be
# overridden at runtime with -D<key> or an upper-cased, "."->"_" environment
# variable, e.g. -Dbrowser=firefox or BASE_URL=... (see .claude/CLAUDE.md).

# AC-001 target URL. Must stay https:// so ConfigReader.getBaseUrl()'s
# fail-closed guard (AD-004) passes without the insecure opt-out.
base.url=https://opensource-demo.orangehrmlive.com/web/index.php/auth/login

# chrome | firefox | edge (DriverManager, TASK-005)
browser=chrome

# true|false - run the configured browser headless
headless=true

# seconds - default explicit wait used by BasePage (TASK-006) per-control checks
explicit.wait=10

# seconds - WebDriver page-load timeout applied by DriverManager (TASK-005)
page.load.timeout=30

# Preventive guard opt-out (AD-004): must be explicitly set to "true" to allow
# a non-https base.url, and only for a local, non-TLS sandbox. Left unset
# (defaulting to false) for this suite, which targets the public HTTPS demo
# host above. Never set to true against a real/production target.
allow.insecure.base.url=false
